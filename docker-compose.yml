# ---------------------------------------------------------------------------
# Full stack for local development and for verifying the images build.
#
#   docker compose up -d db          # database only (recommended for dev)
#   docker compose --profile app up  # database + API + web
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: mini-erp-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mini_erp_crm
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d mini_erp_crm']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: mini-erp-crm-api
    profiles: ['app']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://erp:erp_password@db:5432/mini_erp_crm?schema=public
      # No connection pooler in front of this PostgreSQL, so the direct URL that
      # Prisma Migrate requires is simply the same value.
      DIRECT_DATABASE_URL: postgresql://erp:erp_password@db:5432/mini_erp_crm?schema=public
      JWT_SECRET: ${JWT_SECRET:-compose-development-secret-change-me}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:8080
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Password@123}
    ports:
      - '4000:4000'
    # Apply migrations before serving so a fresh volume comes up ready.
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000/api
    container_name: mini-erp-crm-web
    profiles: ['app']
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  db_data:
