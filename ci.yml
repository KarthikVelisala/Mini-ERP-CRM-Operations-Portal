name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, migrate, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: mini_erp_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d mini_erp_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://erp:erp_password@localhost:5432/mini_erp_crm_test?schema=public
      DIRECT_DATABASE_URL: postgresql://erp:erp_password@localhost:5432/mini_erp_crm_test?schema=public
      TEST_DATABASE_URL: postgresql://erp:erp_password@localhost:5432/mini_erp_crm_test?schema=public
      JWT_SECRET: continuous-integration-secret-value
      SEED_DEFAULT_PASSWORD: Password@123
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (runtime sources and tests)
        run: npm run typecheck

      - name: Verify migrations apply to a clean database
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Run API integration tests
        run: npm test

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://mini-erp-crm-api.onrender.com/api

  docker:
    name: Docker — images build
    runs-on: ubuntu-latest
    # Only worth the minutes once the application jobs are green.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mini-erp-crm-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t mini-erp-crm-frontend:ci ./frontend
